    ## Revision Guidance

    When applying feedback, follow these principles:

    1. **Additive by default:** If the feedback says "add X", add it without removing
      existing validated elements.
    2. **Explicit removal only:** Only remove a module, route, model, or diagram element
      if the feedback explicitly says to remove it.
    3. **Cascading consistency:** If a feedback changes a data model, check and update
      all affected routes, user journeys, security contracts, and diagrams.
    4. **Diagram alignment:** The diagrams MUST reflect the specs. If you add a new
      container in the specs, it must appear in the Container diagram. If you add
      new components to a container, update or create its Component diagram.
    5. **Justify changes:** At the top of your output, add a short "## Changes Applied"
      section listing what changed and why, before the specs.

    ---

    ## Output Format

    CRITICAL: Output ALL sections every revision — specs AND diagrams — even if unchanged.
    Downstream agents parse the delimiters and will fail if a section is missing.

    ## Changes Applied
    - <bullet list of what changed and why>

    ===SPECS_START===
    <ALL specification sections 1.1 through 1.7, complete, not summarized>
    ===SPECS_END===

    ===DIAGRAMS_START===
    ```mermaid
    C4Context
      title System Context — <system name>
      <declarations and relations>
    ```

    ```mermaid
    C4Container
      title Container Diagram — <system name>
      <declarations and relations>
    ```

    <!-- One C4Component per significant container. Use 3a, 3b, 3c… numbering. -->

    ```mermaid
    C4Component
      title Component Diagram — <system name> <container name>
      <declarations and relations>
    ```

    <!-- Repeat for each significant container -->

    ===DIAGRAMS_END===

    ---

    ## Final Checklist (verify before outputting)

    ### Completeness
    ✅ "Changes Applied" section present at the top
    ✅ ALL 7 specification sections (1.1–1.7) are present and complete
    ✅ No section says "unchanged, see previous" — always reproduce the full content
    ✅ Both ===SPECS_START/END=== and ===DIAGRAMS_START/END=== delimiters present

    ### Structure
    ✅ Exactly 1 C4Context diagram
    ✅ Exactly 1 C4Container diagram
    ✅ 1 C4Component diagram per container with meaningful logic and ≥ 3 components
    ✅ No C4Component diagram for databases, queues, or trivial static frontends
    ✅ Each diagram in its own ```mermaid block

    ### Syntax
    ✅ No `UpdateLayoutConfig`, no `graph`, no `flowchart` keywords
    ✅ ALIAS CHECK: For every `Rel(A, B, ...)` in every diagram — A and B are declared
       as an element in that SAME diagram (scan each diagram independently)
    ✅ `Person()` declared in EVERY diagram that references a person alias in a `Rel()`
    ✅ `System_Ext()` declared in EVERY diagram that references an external system alias
    ✅ Sibling `Container()` / `ContainerDb()` / `ContainerQueue()` declared in EVERY
       Component diagram that references them in a `Rel()` — even if declared in Diagram 2
    ✅ `Container_Boundary` used for nesting (never bare `Boundary()`)
    ✅ `System_Boundary` only in the Container diagram, not in Component diagrams

    ### Quality
    ✅ Every element has a description of key responsibilities
    ✅ Every Container and Component specifies its technology
    ✅ Every arrow has a specific label (not just "Uses") AND a protocol
    ✅ Components represent major building blocks, NOT individual classes
    ✅ [AUTH] marked on routes requiring authentication in the specs
    ✅ No implementation code anywhere

    ### Revision Consistency
    ✅ Feedback changes are reflected in BOTH specs and diagrams
    ✅ No orphan: every container in specs appears in the Container diagram
    ✅ No orphan: every component mentioned in specs appears in its Component diagram
    ✅ Previously validated decisions are preserved unless explicitly overridden
