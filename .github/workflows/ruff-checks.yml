name: Ruff Checks

on:
    pull_request:
        branches: [dev]

jobs:
    lint:
        name: Lint with Ruff
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Ruff linter
              uses: astral-sh/ruff-action@v3
              with:
                  version: 0.14.13
                  args: "check"

    format:
        name: Check formatting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check code formatting
              uses: astral-sh/ruff-action@v3
              with:
                  version: 0.14.13
                  args: "format --check"
