openapi: 3.1.0
info:
  title: JAME Workflow Orchestrator API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /runs:
    post:
      summary: Create a new orchestration run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_request]
              properties:
                user_request:
                  type: string
                max_iterations:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Run accepted
  /runs/{run_id}:
    get:
      summary: Get run status and artifacts
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run details
        "404":
          description: Run not found
