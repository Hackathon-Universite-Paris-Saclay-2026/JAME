[project]
name = "todo-app"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 80
target-version = "py311"
exclude = [".git", ".github", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "ANN", "S", "PTH", "RET", "ARG", "Q", "RUF", "TRY"]
ignore = ["D203", "D213", "E501", "ANN401", "D107", "COM812", "ISC001", "TRY003"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"test_*.py" = ["D", "ANN", "S101"]
"**/tests/**/*.py" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"