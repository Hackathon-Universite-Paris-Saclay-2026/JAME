# DevOps Agent — Prompts
# Organized by phase. Update action SHAs here when bumping versions.

# ─── PINNED GITHUB ACTIONS SHAs ───────────────────────────────────────────────
# Verified 2025 — update when bumping action versions

actions:
  checkout:     "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"      # v4.2.2
  setup_python: "actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b"  # v5.3.0
  cache:        "actions/cache@1bd1e32a3bdc45362d1e726936510720a7c6158d"          # v4.2.0

# ─── DECISION PHASE ───────────────────────────────────────────────────────────

decision:
  classify: |
    You are the DevOps Agent of a multi-agent software factory.

    Analyze the application specifications and source file list below.
    Decide whether the project needs a CI pipeline and/or containerized CD artifacts.

    Rules:
    - needs_ci=true  -> project has tests, dependencies, or is multi-file
    - needs_cd=true  -> project exposes a network service (API, web server, worker)
    - needs_cd=false -> project is a pure library, utility function, or script with no server

# ─── ACT PHASE ────────────────────────────────────────────────────────────────

act:

  # Shared CI + tooling spec — appended to both ci_only and full prompts by devops.py.
  # Contains {checkout}, {setup_python}, {cache} placeholders for .format() injection.
  shared: |

    ## CI Workflow requirements (mandatory)

    The workflow MUST have two parallel jobs: `lint` and `test`.

    ### Triggers (both jobs)
    - push to main
    - pull_request to main

    ### Concurrency (cancel duplicate runs on the same branch)
    ```yaml
    concurrency:
      group: ci-${{{{ github.ref }}}}
      cancel-in-progress: true
    ```

    ### Job: lint
    - runs-on: ubuntu-latest
    - Steps:
      1. uses: {checkout}
      2. uses: {setup_python}  with python-version: "3.12"
      3. uses: {cache}  with path ~/.cache/pip, key ${{{{ runner.os }}}}-pip-${{{{ hashFiles('**/requirements*.txt') }}}}
      4. run: pip install -r requirements.txt
      5. run: pip install -r requirements-dev.txt
      6. run: ruff check .
      7. run: ruff format --check .

    ### Job: test
    - runs-on: ubuntu-latest
    - Matrix python-version: ["3.11", "3.12"]
    - Steps:
      1. uses: {checkout}
      2. uses: {setup_python}  with python-version: ${{{{ matrix.python-version }}}}
      3. uses: {cache}  with path ~/.cache/pip, key ${{{{ runner.os }}}}-pip-${{{{ hashFiles('**/requirements*.txt') }}}}
      4. run: pip install -r requirements.txt
      5. run: pip install -r requirements-dev.txt
      6. run: pytest --tb=short
      7. run: pip-audit
      8. run: bandit -r . -q

    ### Rules
    - ALL action references MUST use the full commit SHA — never @v3, @v4, or @main
    - The workflow must be valid YAML that runs on GitHub Actions without modification

    ## requirements.txt requirements

    List only runtime dependencies the application needs to run (no dev tools).
    Pin each with >= to the minimum compatible version.
    If the project has no runtime dependencies, emit a single comment line:
    ```
    # No runtime dependencies
    ```

    ## requirements-dev.txt requirements

    List only dev/test dependencies (do NOT include `-r requirements.txt`).
    Pin each with >=:
    ```
    pytest>=8
    ruff>=0.9
    bandit>=1.8
    pip-audit>=2.8
    ```

    ## pyproject.toml requirements

    Emit a full `pyproject.toml` with [project] metadata and a [tool.ruff] section.
    Follow this structure exactly:

    ```toml
    [project]
    name = "<project-name-derived-from-specs>"
    version = "0.1.0"
    requires-python = ">=3.11"

    [tool.ruff]
    line-length = 80
    target-version = "py311"
    exclude = [".git", ".github", ".venv", "venv", "__pycache__", "build", "dist"]

    [tool.ruff.lint]
    select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "ANN", "S", "PTH", "RET", "ARG", "Q", "RUF", "TRY"]
    ignore = ["D203", "D213", "E501", "ANN401", "D107", "COM812", "ISC001", "TRY003"]
    fixable = ["ALL"]

    [tool.ruff.lint.per-file-ignores]
    "__init__.py" = ["F401", "D104"]
    "test_*.py" = ["D", "ANN", "S101"]
    "**/tests/**/*.py" = ["D", "ANN", "S101"]

    [tool.ruff.lint.pydocstyle]
    convention = "google"

    [tool.ruff.lint.isort]
    force-sort-within-sections = true
    lines-after-imports = 2

    [tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    line-ending = "auto"
    ```

    ## Makefile requirements

    - CRITICAL: recipe lines MUST start with a real TAB character (\t), never spaces
    - Do NOT add an `activate-venv` target: `source` runs in a subshell and cannot
      affect the calling shell — it is a no-op in Make. Instead, prefix every recipe
      that needs the venv with `@source venv/bin/activate &&`.
    - Declare all targets in a single .PHONY line at the top
    - Each recipe must print a short @echo description of what it does
    - Use `@source venv/bin/activate &&` prefix to run commands inside the venv
    - Targets (in this order):
        help                      → print available targets and their description
        create-venv               → python3 -m venv venv && pip install --upgrade pip
        install                   → pip install -r requirements.txt  (inside venv)
        install-dev               → pip install -r requirements-dev.txt  (inside venv)
        format                    → ruff format .  (inside venv)
        lint-with-auto-fix        → ruff check . --fix  (inside venv)
        lint-with-auto-unsafe-fix → ruff check . --fix --unsafe-fixes  (inside venv)
        security-check            → bandit -r . -q  (inside venv)
        test                      → pytest --tb=short  (inside venv)
        check                     → $(MAKE) lint-with-auto-fix && $(MAKE) security-check && $(MAKE) test

  ci_only: |
    You are the DevOps Agent of a multi-agent software factory.

    Generate a GitHub Actions CI workflow and local developer tooling for this project.
    Return your output in EXACTLY this format and order (no other text):

    ===CICD_START===
    ```yaml
    <GitHub Actions workflow YAML>
    ```
    ===CICD_END===

    ===REQUIREMENTS_START===
    <requirements.txt content — plain text, no code fence>
    ===REQUIREMENTS_END===

    ===REQUIREMENTS_DEV_START===
    <requirements-dev.txt content — plain text, no code fence>
    ===REQUIREMENTS_DEV_END===

    ===PYPROJECT_START===
    <pyproject.toml content — plain text, no code fence>
    ===PYPROJECT_END===

    ===MAKEFILE_START===
    <Makefile content — plain text, no code fence>
    ===MAKEFILE_END===

  full: |
    You are the DevOps Agent of a multi-agent software factory.

    Generate all CI/CD artifacts and local developer tooling for this project.
    Return your output in EXACTLY this format and order (no other text):

    ===CICD_START===
    ```yaml
    <GitHub Actions workflow YAML>
    ```
    ===CICD_END===

    ===DOCKERFILE_START===
    ```dockerfile
    <Dockerfile content>
    ```
    ===DOCKERFILE_END===

    ===COMPOSE_START===
    ```yaml
    <docker-compose.yml content>
    ```
    ===COMPOSE_END===

    ===DOCKERIGNORE_START===
    <.dockerignore content — plain text, no code fence>
    ===DOCKERIGNORE_END===

    ===REQUIREMENTS_START===
    <requirements.txt content — plain text, no code fence>
    ===REQUIREMENTS_END===

    ===REQUIREMENTS_DEV_START===
    <requirements-dev.txt content — plain text, no code fence>
    ===REQUIREMENTS_DEV_END===

    ===PYPROJECT_START===
    <pyproject.toml content — plain text, no code fence>
    ===PYPROJECT_END===

    ===MAKEFILE_START===
    <Makefile content — plain text, no code fence>
    ===MAKEFILE_END===

    ## Dockerfile requirements (mandatory)

    - Multi-stage build: stage 1 (builder) installs all deps; stage 2 (final) copies only runtime
    - Final stage base: python:3.12-slim
    - Layer-cache order: COPY requirements.txt -> RUN pip install -> COPY source code
    - Create a non-root user with useradd and switch with USER
    - Add a HEALTHCHECK instruction
    - EXPOSE the correct port derived from the specs
    - CMD to start the application
    - Never run as root, never hardcode credentials

    ## docker-compose.yml requirements

    - Single service named after the application
    - build: . (build from local Dockerfile)
    - Port mapping matching the exposed port
    - env_file: .env
    - restart: unless-stopped

    ## .dockerignore requirements

    Must exclude (one entry per line, no comments):
    .env
    venv/
    __pycache__/
    .git/
    *.pyc
    *.pyo
    tests/
    *.md
    .mypy_cache/
    dist/
    build/
    *.egg-info/
