    ===REQUIREMENTS_END===

    ===REQUIREMENTS_DEV_START===
    <requirements-dev.txt content — plain text, no code fence>
    ===REQUIREMENTS_DEV_END===

    ===PYPROJECT_START===
    <pyproject.toml content — plain text, no code fence>
    ===PYPROJECT_END===

    ===MAKEFILE_START===
    <Makefile content — plain text, no code fence>
    ===MAKEFILE_END===

    ===GITIGNORE_START===
    <.gitignore content — plain text, no code fence>
    ===GITIGNORE_END===

    ===ENV_EXAMPLE_START===
    <.env.example content — plain text, no code fence>
    ===ENV_EXAMPLE_END===

    ## Dockerfile requirements (mandatory)

    Use this EXACT multi-stage pattern — do NOT deviate:

    ```dockerfile
    # ── Stage 1: builder ──────────────────────────────────────────
    FROM python:3.12-slim AS builder
    WORKDIR /app
    RUN python -m venv /venv
    COPY requirements.txt .
    RUN /venv/bin/pip install --no-cache-dir -r requirements.txt

    # ── Stage 2: final ────────────────────────────────────────────
    FROM python:3.12-slim
    WORKDIR /app
    # Install curl for the HEALTHCHECK before switching user
    RUN apt-get update && apt-get install -y --no-install-recommends curl \
        && rm -rf /var/lib/apt/lists/*
    # Copy the venv (contains all installed packages) from builder
    COPY --from=builder /venv /venv
    ENV PATH="/venv/bin:$PATH"
    # Copy source code
    COPY . .
    # Create non-root user and take ownership AFTER copying files
    RUN useradd -ms /bin/bash appuser && chown -R appuser /app
    USER appuser
    EXPOSE <port>
    HEALTHCHECK --interval=30s --timeout=5s --retries=3 \
        CMD curl --fail http://localhost:<port>/health || exit 1
    CMD [...]
    ```

    Rules:
    - Replace `<port>` with the port derived from the specs
    - Replace `CMD [...]` with the correct entrypoint for the application
    - Never run as root, never hardcode credentials
    - Never install dev dependencies in the final image

    ## docker-compose.yml requirements

    Include ALL services required to run the application locally — not just the app itself.
    Derive infrastructure services from the specs (databases, caches, queues, object storage, etc.).

    For each infrastructure service (derived solely from the specs — do not add services not mentioned):
    - Use the official lightweight image for that technology
    - Expose the standard port(s) for that service so it is reachable from the host
    - Add a healthcheck using the correct format:
        RULE: test MUST start with "CMD" or "CMD-SHELL" as the first array element.
        Use "CMD" only when every argument is a separate element, e.g.:
          `test: ["CMD", "redis-cli", "ping"]`
        Use "CMD-SHELL" when the command contains shell syntax, flags, or pipes, e.g.:
          `test: ["CMD-SHELL", "pg_isready -U myuser"]`
          `test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]`
        NEVER put a shell command with flags as a single argument to "CMD".
        For MinIO specifically use: `test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]`
    - For object-storage services (MinIO):
        - add `command: server /data` so the server actually starts
        - use `MINIO_ROOT_USER` / `MINIO_ROOT_PASSWORD` (NOT the deprecated MINIO_ACCESS_KEY / MINIO_SECRET_KEY)
    - ALL services must have a named volume for data persistence (including redis and rabbitmq)
    - ALL services must have restart: unless-stopped

    For the application service:
    - build: .
    - Port mapping matching the exposed port
    - env_file: .env
    - restart: unless-stopped
    - depends_on every infrastructure service using condition: service_healthy, e.g.:
        ```yaml
        depends_on:
          <service-name>:
            condition: service_healthy
        ```

    Declare all named volumes at the bottom under a top-level `volumes:` key.

    ## .env.example requirements

    Generate a `.env.example` with ONLY the variables the application source code reads at runtime.
    These are connection strings and config values consumed by the app — NOT bootstrap credentials
    for configuring infra services (those belong in docker-compose.yml environment blocks).

    RULE: every variable must be a URL or config the app passes to a client library.
    NEVER include raw credentials like POSTGRES_USER, POSTGRES_PASSWORD, MINIO_ACCESS_KEY, etc.
    Those are docker-compose internals; they must NOT appear in .env.example.

    Variable naming and default values by service type (use real defaults so `cp .env.example .env`
    is enough to run `docker-compose up` immediately — no manual editing required):
    - PostgreSQL  → DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app
    - Redis       → REDIS_URL=redis://redis:6379/0
    - RabbitMQ    → AMQP_URL=amqp://guest:guest@rabbitmq:5672/
    - MinIO / S3  → S3_ENDPOINT_URL=http://s3:9000
                    S3_ACCESS_KEY=minioadmin
                    S3_SECRET_KEY=minioadmin
                    S3_BUCKET_NAME=app-bucket

    CRITICAL: the credentials embedded in these URLs must match the values set in the
    docker-compose.yml environment blocks for the corresponding infra service.
    Use the docker-compose service name as the hostname in every URL.
    Group variables by service with a comment header, one variable per line.

    ## .dockerignore requirements

    Must exclude (one entry per line, no comments):
    .env
    venv/
    __pycache__/
    .git/
    *.pyc
    *.pyo
    tests/
    *.md
    .mypy_cache/
    dist/
    build/
    *.egg-info/
