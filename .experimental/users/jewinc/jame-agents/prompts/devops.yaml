# DevOps Agent — Prompts
# Organized by phase. Update action SHAs here when bumping versions.

# ─── PINNED GITHUB ACTIONS SHAs ───────────────────────────────────────────────
# Verified 2025 — update when bumping action versions

actions:
  checkout:     "actions/checkout@v4"
  setup_python: "actions/setup-python@v5"
  cache:        "actions/cache@v4"

# ─── DECISION PHASE ───────────────────────────────────────────────────────────

decision:
  classify: |
    You are the DevOps Agent of a multi-agent software factory.

    Analyze the application specifications and source file list below.
    Decide whether the project needs a CI pipeline and/or containerized CD artifacts.

    ## needs_ci rules

    needs_ci=true ONLY when the project has multiple source files that import from each other
    (i.e. a real module graph exists between production files).

    needs_ci=false when the project is a single self-contained function or script, even if:
    - a test file exists alongside it
    - the function has a requirements.txt
    - the spec mentions edge cases or input validation

    Decision guide:
    - Single function / pure utility (e.g. fibonacci, string formatter, math helper) → false
    - Library with multiple modules importing each other                              → true
    - Service or application with routes, models, services, utils split across files  → true
    - Script that calls external APIs but is a single file                            → false

    ## needs_cd rules

    needs_cd=true  -> project exposes a persistent network service (API, web server, worker, daemon)
    needs_cd=false -> pure function, library, script, or CLI tool with no server

# ─── ACT PHASE ────────────────────────────────────────────────────────────────

act:

  # Shared CI + tooling spec — appended to both ci_only and full prompts by devops.py.
  # Contains {checkout}, {setup_python}, {cache} placeholders for .format() injection.
  shared: |

    ## CI Workflow requirements (mandatory)

    The workflow MUST have two parallel jobs: `lint` and `test`.

    ### Triggers (both jobs)
    - push to main
    - pull_request to main

    ### Concurrency (cancel duplicate runs on the same branch)
    ```yaml
    concurrency:
      group: ci-${{{{ github.ref }}}}
      cancel-in-progress: true
    ```

    ### Job: lint
    - runs-on: ubuntu-latest
    - Steps:
      1. uses: {checkout}
      2. uses: {setup_python}  with python-version: "3.12"
      3. uses: {cache}  with path ~/.cache/pip, key ${{{{ runner.os }}}}-pip-${{{{ hashFiles('**/requirements*.txt') }}}}
      4. run: pip install -r requirements.txt
      5. run: pip install -r requirements-dev.txt
      6. run: ruff check .
      7. run: ruff format --check .

    ### Job: test
    - runs-on: ubuntu-latest
    - Matrix python-version: ["3.11", "3.12"]
    - Steps:
      1. uses: {checkout}
      2. uses: {setup_python}  with python-version: ${{{{ matrix.python-version }}}}
      3. uses: {cache}  with path ~/.cache/pip, key ${{{{ runner.os }}}}-pip-${{{{ hashFiles('**/requirements*.txt') }}}}
      4. run: pip install -r requirements.txt
      5. run: pip install -r requirements-dev.txt
      6. run: pytest --tb=short
      7. run: pip-audit

    ### Rules
    - The workflow must be valid YAML that runs on GitHub Actions without modification

    ## requirements.txt requirements

    List every runtime dependency the application needs to run (no dev tools).
    Derive them from the application specifications — databases, caches, queues, HTTP clients, etc.
    Pin each with >= to the minimum compatible version.

    Examples of dependencies to infer:
    - PostgreSQL access  → psycopg2-binary>=2.9
    - Redis access       → redis>=5.0
    - RabbitMQ / AMQP   → aio-pika>=9.0
    - HTTP API (FastAPI) → fastapi>=0.110, uvicorn>=0.29
    - HTTP client        → httpx>=0.27 or requests>=2.31
    - AWS S3             → boto3>=1.34

    Only emit `# No runtime dependencies` for trivial projects with no I/O
    (e.g. a pure utility function with no external services).

    ## requirements-dev.txt requirements

    List only dev/test dependencies (do NOT include `-r requirements.txt`).
    Pin each with >=:
    ```
    pytest>=8
    ruff>=0.9
    pip-audit>=2.8
    ```

    ## pyproject.toml requirements

    Emit a full `pyproject.toml` with [project] metadata and a [tool.ruff] section.
    Follow this structure exactly:

    ```toml
    [project]
    name = "<project-name-derived-from-specs>"
    version = "0.1.0"
    requires-python = ">=3.11"

    [tool.ruff]
    line-length = 80
    target-version = "py311"
    exclude = [".git", ".github", ".venv", "venv", "__pycache__", "build", "dist"]

    [tool.ruff.lint]
    select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "ANN", "S", "PTH", "RET", "ARG", "Q", "RUF", "TRY"]
    ignore = ["D203", "D213", "E501", "ANN401", "D107", "COM812", "ISC001", "TRY003"]
    fixable = ["ALL"]

    [tool.ruff.lint.per-file-ignores]
    "__init__.py" = ["F401", "D104"]
    "test_*.py" = ["D", "ANN", "S101"]
    "**/tests/**/*.py" = ["D", "ANN", "S101"]

    [tool.ruff.lint.pydocstyle]
    convention = "google"

    [tool.ruff.lint.isort]
    force-sort-within-sections = true
    lines-after-imports = 2

    [tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    line-ending = "auto"
    ```

    ## .gitignore requirements

    Emit this file verbatim:
    ```
    # Python
    __pycache__/
    *.py[cod]
    *.pyo
    *.pyd
    *.egg-info/
    dist/
    build/
    .eggs/

    # Virtual environments
    venv/
    .venv/
    env/

    # Environment & secrets
    .env
    .env.*
    !.env.example

    # Tools
    .mypy_cache/
    .ruff_cache/
    .pytest_cache/
    .coverage
    htmlcov/

    # IDE
    .idea/
    .vscode/
    ```

    ## Makefile requirements

    - CRITICAL: recipe lines MUST start with a real TAB character (\t), never spaces
    - Do NOT add an `activate-venv` target: `source` runs in a subshell and cannot
      affect the calling shell — it is a no-op in Make. Instead, prefix every recipe
      that needs the venv with `@source venv/bin/activate &&`.
    - Declare all targets in a single .PHONY line at the top
    - Each recipe must print a short @echo description of what it does
    - Use `@source venv/bin/activate &&` prefix to run commands inside the venv
    - Targets (in this order):
        help                      → print available targets and their description
        create-venv               → python3 -m venv venv && pip install --upgrade pip
        install                   → pip install -r requirements.txt  (inside venv)
        install-dev               → pip install -r requirements-dev.txt  (inside venv)
        format                    → ruff format .  (inside venv)
        lint-with-auto-fix        → ruff check . --fix  (inside venv)
        lint-with-auto-unsafe-fix → ruff check . --fix --unsafe-fixes  (inside venv)
        test                      → pytest --tb=short  (inside venv)
        check                     → $(MAKE) lint-with-auto-fix && $(MAKE) test

  ci_only: |
